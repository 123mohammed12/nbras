<div class="mt-3">
    {% if is_valid %}
    <div class="alert alert-success d-flex align-items-center mb-0" role="alert">
        <svg class="bi flex-shrink-0 me-2" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div>
            <strong>النموذج مكتمل وجاهز للنشر!</strong>
            <div class="small">جميع العناصر والأسئلة منشورة، ومجموع الدرجات والربط مع الاختبار التفاعلي سليم تماماً.</div>
        </div>
    </div>
    {% else %}
    <div class="alert alert-danger d-flex align-items-center mb-0" role="alert">
        <svg class="bi flex-shrink-0 me-2" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div>
            <strong>تعذر التحقق من جاهزية النشر:</strong>
            <div class="small">{{ error_message }}</div>
        </div>
    </div>
    {% endif %}
</div>
