    <div class="card-body p-2">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item">
                <a class="nav-link {% if active_subtab == 'overview' %}active fw-bold{% endif %}" href="{% url 'control:notifications_overview' %}">
                    📊 نظرة عامة ومؤشرات
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_subtab == 'list' %}active fw-bold{% endif %}" href="{% url 'control:notification_list' %}">

                </a>
            </li>
            {% if perms.notifications.add_notification or user.is_superuser %}

                <a class="nav-link {% if active_subtab == 'create' %}active fw-bold{% endif %}" href="{% url 'control:notification_create' %}">
